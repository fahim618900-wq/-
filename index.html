<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>দৈনিক পাঠ্যসূচি</title>
<link href="https://fonts.maateen.me/kalpurush/font.css" rel="stylesheet">
<style>
:root{
  --blue:#2563eb;
  --blue-dark:#1d4ed8;
  --blue-soft:#eef2ff;
  --blue-light:#f5f8ff;
  --ink:#1e293b;
  --muted:#64748b;
  --paper:#f1f5f9;
  --white:#ffffff;
  --line:1px;
  --radius:14px;
  --shadow:0 4px 14px rgba(15,23,42,.08);
  --shadow-sm:0 2px 8px rgba(15,23,42,.06);
}
*{
  box-sizing:border-box;
  font-family:'Kalpurush', sans-serif;
  font-weight:normal;
}
html,body{ background:var(--paper); }
body{ margin:0; padding:18px; color:var(--ink); min-height:100%; }
svg.icon{ width:18px; height:18px; flex-shrink:0; }

/* ===== ফর্ম পেজ ===== */
.box{ max-width:480px; margin:auto; }
.eyebrow{ font-size:15px; color:var(--blue); margin:0 0 4px 2px; letter-spacing:.3px; }
h2{ font-size:26px; margin:0 0 18px 2px; color:var(--ink); }

.field{ background:var(--white); border:var(--line) solid #e2e8f0; border-radius:var(--radius);
  box-shadow:var(--shadow-sm); padding:12px 14px; margin-bottom:14px; }
label{ font-size:15px; display:block; margin-bottom:6px; color:var(--ink); }
select,input[type=date]{ width:100%; padding:9px 6px; border:none; border-bottom:1.5px solid #e2e8f0;
  background:transparent; font-size:17px; color:var(--ink); transition:border-color .2s; }
select:focus,input:focus{ outline:none; border-color:var(--blue); }

.subject-row{ display:flex; align-items:center; gap:10px; margin-top:10px; }
.subject-row label{ width:38%; margin:0; font-size:15px; }
.subject-input{ flex:1; padding:8px 6px; border:none; border-bottom:1.5px solid #e2e8f0; background:transparent;
  font-size:16px; color:var(--ink); transition:border-color .2s; }
.subject-input:focus{ outline:none; border-color:var(--blue); }
.subject-input::placeholder{ color:#cbd5e1; font-size:14px; }

#genBtn{ width:100%; padding:15px; border:none; border-radius:12px;
  background:var(--blue); color:#fff; font-size:17px; cursor:pointer; margin-top:6px;
  box-shadow:0 4px 12px rgba(37,99,235,.25); display:flex; align-items:center; justify-content:center; gap:8px;
  transition:background .2s, transform .1s; }
#genBtn:hover{ background:var(--blue-dark); }
#genBtn:active{ transform:scale(.99); }

/* ===== প্রিভিউ পেজ ===== */
#previewPage{ display:none; max-width:560px; margin:auto; }
#cardViewport{ width:100%; position:relative; margin:auto; }

.routine-card{
  width:100%;
  background:var(--white);
  border:1px solid #e2e8f0;
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

.header{
  background:var(--blue-soft);
  border-bottom:1px solid #e2e8f0;
  padding:2% 3%;
  text-align:center;
  flex:0 0 auto;
}
.title{ font-size:1.3em; color:var(--ink); margin-bottom:1%; line-height:1.15; }
.class-banner{
  display:inline-block; background:var(--white); color:var(--blue);
  padding:0.3% 3%; border-radius:20px; font-size:0.95em;
  border:1px solid #c7d2fe;
}

.date-row{ flex:0 0 auto; display:flex; justify-content:space-between; align-items:center;
  background:var(--white); padding:1.2% 3%; border-bottom:1px solid #eef2f7;
  font-size:0.85em; color:var(--ink); }
.date-row .label{ display:flex; align-items:center; gap:5px; color:var(--blue); }
.date-row .label svg{ width:0.9em; height:0.9em; }

.content{ flex:1 1 auto; padding:1.2% 2.4%; overflow:hidden; display:flex; min-height:0; }
#tableWrap{ width:100%; height:100%; overflow:hidden; position:relative; }
.routine-table{ width:100%; border-collapse:collapse; table-layout:fixed; transform-origin:top left; }
.routine-table tr{ border-bottom:1px solid #eef2f7; }
.routine-table tr:last-child{ border-bottom:none; }
.routine-table td{ padding:0.3% 1%; vertical-align:middle; line-height:1.25; word-break:break-word;
  font-size:12px; color:var(--ink); }
.subject-cell{ width:38%; color:var(--blue); }
.lesson-cell{ width:62%; }

.footer{
  background:var(--blue-light);
  border-top:1px solid #e2e8f0;
  padding:0.8% 2.4%;
  text-align:center;
  flex:0 0 auto;
}
.institution{ font-size:0.8em; color:var(--ink); margin-bottom:0.2%; }
.contact-line{ font-size:0.6em; color:var(--muted); line-height:1.25; }
.contact-line span{ margin:0 2px; }

[contenteditable="true"]{ outline:none; border-radius:4px; padding:1px 3px; cursor:text; transition:background .15s; }
[contenteditable="true"]:focus{ background:rgba(37,99,235,.10); box-shadow:0 0 0 2px rgba(37,99,235,.35); }

.hint{ display:flex; align-items:center; justify-content:center; gap:6px; font-size:13px; color:var(--muted);
  margin:10px 0 0; }

.action-bar{ display:flex; gap:10px; margin-top:14px; }
.action-bar button{ flex:1; padding:13px; border:none; border-radius:12px;
  font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  gap:7px; transition:background .2s, transform .1s, box-shadow .2s; }
.action-bar button:active{ transform:scale(.98); }
#downloadBtn{ background:var(--blue); color:#fff; box-shadow:0 4px 12px rgba(37,99,235,.25); }
#downloadBtn:hover{ background:var(--blue-dark); }
#shareBtn{ background:#fff; color:var(--ink); border:1px solid #e2e8f0; box-shadow:var(--shadow-sm); }
#shareBtn:hover{ background:#f8fafc; }

#backBtn{ width:100%; padding:11px; border:1px solid #e2e8f0; border-radius:12px; background:transparent;
  color:var(--muted); font-size:15px; cursor:pointer; margin-top:10px;
  display:flex; align-items:center; justify-content:center; gap:6px;
  transition:background .2s, color .2s; }
#backBtn:hover{ background:#f8fafc; color:var(--ink); }

#doneBtn{
  display:none;
  position:fixed;
  bottom:24px;
  right:24px;
  padding:13px 26px;
  background:var(--blue);
  color:#fff;
  border:none;
  border-radius:28px;
  font-size:16px;
  font-family:'Kalpurush', sans-serif;
  box-shadow:0 6px 18px rgba(37,99,235,.45);
  z-index:9999;
  cursor:pointer;
  align-items:center;
  gap:8px;
  transition:background .2s, transform .1s;
  animation:donePulse .3s ease;
}
#doneBtn.show{ display:flex; }
#doneBtn:hover{ background:var(--blue-dark); }
#doneBtn:active{ transform:scale(.96); }
#doneBtn svg{ width:18px; height:18px; }

@keyframes donePulse{
  from { opacity:0; transform: translateY(20px); }
  to   { opacity:1; transform: translateY(0); }
}

#toast{
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(100px);
  background:var(--ink); color:#fff; padding:10px 18px; border-radius:24px;
  font-size:14px; box-shadow:0 8px 20px rgba(0,0,0,.2); z-index:999;
  transition:transform .3s ease; pointer-events:none;
}
#toast.show{ transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="box" id="formPage">
  <div class="eyebrow">নতুন এন্ট্রি</div>
  <h2>দৈনিক পাঠ্যসূচি</h2>

  <div class="field">
    <label>শ্রেণি</label>
    <select id="cls" onchange="loadSubjects()">
      <option value="">-- শ্রেণি নির্বাচন করুন --</option>
      <option>প্লে</option><option>নার্সারি</option><option>প্রথম</option><option>দ্বিতীয়</option>
      <option>তৃতীয়</option><option>চতুর্থ</option><option>পঞ্চম</option><option>ষষ্ঠ</option>
    </select>
  </div>

  <div class="field">
    <label>তারিখ</label>
    <input type="date" id="date">
  </div>

  <div class="field" id="subjectsField" style="display:none;">
    <label>বিষয়ভিত্তিক পাঠ্যসূচি</label>
    <div id="subjectsBox"></div>
  </div>

  <button id="genBtn" onclick="showPreview()">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
    প্রিভিউ দেখুন
  </button>
</div>

<div id="previewPage">
  <div id="cardViewport">
    <div class="routine-card" id="card">
      <div class="header">
        <div class="title">দৈনিক পাঠ্যসূচি</div>
        <div class="class-banner" contenteditable="true" id="editClass">শ্রেণি: </div>
      </div>

      <div class="date-row">
        <span class="label">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          তারিখ
        </span>
        <span class="value" contenteditable="true" id="editDate"></span>
      </div>

      <div class="content">
        <div id="tableWrap"><table class="routine-table" id="previewTable"></table></div>
      </div>

      <div class="footer">
        <div class="institution">দারুল হিকমাহ মডেল মাদ্রাসা</div>
        <div class="contact-line">
          ফুলপুর, ময়মনসিংহ <span>•</span> +৮৮০ ১৯৭০ ৫১৭৫৬৬ <span>•</span> dhmm.phulpur@gmail.com <span>•</span> Design: Abdullah fahim
        </div>
      </div>
    </div>
  </div>

  <p class="hint">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
    যেকোনো লেখায় ক্লিক করে সরাসরি পরিবর্তন করুন
  </p>

  <div class="action-bar">
    <button id="downloadBtn" onclick="downloadImage()">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
      ডাউনলোড
    </button>
    <button id="shareBtn" onclick="shareImage()">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="m7 8 5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>
      শেয়ার
    </button>
  </div>

  <button id="backBtn" onclick="backToForm()">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
    ফিরে যান
  </button>
</div>

<button id="doneBtn" type="button">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
  সম্পন্ন
</button>

<div id="toast"></div>

<script>
/* ==================== শ্রেণিভিত্তিক বিষয় ==================== */
const classSubjects = {
  "প্লে": ["কোরআন", "আরবি", "ইংরেজি", "গণিত", "ড্রইং", "বাংলা", "সাধারণ জ্ঞান"],
  "নার্সারি": ["গণিত", "ড্রইং", "বাংলা", "সাধারণ জ্ঞান", "কোরআন", "ইংরেজি"],
  "প্রথম": ["ইংরেজি", "কোরআন", "গণিত", "কম্পিউটার", "আরবি", "বাংলা", "সাধারণ জ্ঞান"],
  "দ্বিতীয়": ["বাংলা", "প্রিয় নবী", "গণিত", "আরবি", "ইংরেজি ১ম", "ইংরেজি ২য়", "ওয়ার্ডবুক", "সাধারণ জ্ঞান", "কম্পিউটার", "কোরআন"],
  "তৃতীয়": ["বাংলা", "এসো জীবন গড়ি", "কোরআন", "ইংরেজি ১ম", "ইংরেজি ২য়", "হাদিস", "বিজ্ঞান", "বাংলাদেশ ও বিশ্বপরিচয়", "গণিত", "আরবি", "সাধারণ জ্ঞান", "কম্পিউটার"],
  "চতুর্থ": ["ইংরেজি ১ম", "ইংরেজি ২য়", "বিজ্ঞান", "বাংলাদেশ ও বিশ্বপরিচয়", "বাংলা", "এসো জীবন গড়ি", "কোরআন ও আকাইদ", "আরবি ১ম", "আরবি ২য়", "তালিমুল কোরআন", "কোরআন", "গণিত", "সাধারণ জ্ঞান", "কম্পিউটার"],
  "পঞ্চম": ["আরবি ১ম", "আরবি ২য়", "ইংরেজি", "বাংলা ১ম", "বাংলা ২য়", "বিজ্ঞান", "বাংলাদেশ ও বিশ্বপরিচয়", "গণিত", "কোরআন"],
  "ষষ্ঠ": ["আরবি ১ম", "কোরআন ও আকাইদ", "কৃষি", "তথ্য প্রযুক্তি", "ইংরেজি ১ম", "ইংরেজি ২য়", "বাংলা ১ম", "বাংলা ২য়", "বিজ্ঞান", "বাংলাদেশ ও বিশ্বপরিচয়", "আরবি ২য়", "গণিত"]
};

document.getElementById('date').valueAsDate = new Date();

function showToast(msg){
  const t = document.getElementById('toast');
  t.innerText = msg;
  t.classList.add('show');
  clearTimeout(t._time);
  t._time = setTimeout(() => t.classList.remove('show'), 2000);
}

function bn(num){
  const map = {'0':'০','1':'১','2':'২','3':'৩','4':'৪','5':'৫','6':'৬','7':'৭','8':'৮','9':'৯'};
  return num.toString().replace(/[0-9]/g, d => map[d]);
}

/* =========================================================
   html2canvas lazy-load + promise cache
   ========================================================= */
let _h2cPromise = null;
function loadScript(src){
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}
function ensureHtml2Canvas(){
  if (typeof html2canvas !== 'undefined') return Promise.resolve();
  if (!_h2cPromise){
    _h2cPromise = loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
  }
  return _h2cPromise;
}

/* =========================================================
   ক্যানভাস ক্যাশ (শেয়ার/ডাউনলোড রিইউজ)
   ========================================================= */
let _cachedCanvas = null;
function invalidateCanvasCache(){ _cachedCanvas = null; }

document.getElementById('card').addEventListener('input', invalidateCanvasCache);
window.addEventListener('resize', invalidateCanvasCache);

/* =========================================================
   কার্ডকে SQUARE করা
   ========================================================= */
function sizeCardSquare(){
  const card = document.getElementById('card');
  if (!card) return;
  card.style.height = 'auto';
  const w = card.offsetWidth;
  if (w > 0){
    card.style.height = w + 'px';
  }
}

/* =========================================================
   কীবোর্ড ক্লোজ
   ========================================================= */
const doneBtn = document.getElementById('doneBtn');

document.addEventListener('focusin', (e) => {
  if (e.target.isContentEditable){
    doneBtn.classList.add('show');
  }
});

document.addEventListener('focusout', () => {
  setTimeout(() => {
    if (!document.activeElement || !document.activeElement.isContentEditable){
      doneBtn.classList.remove('show');
    }
  }, 100);
});

doneBtn.addEventListener('click', (e) => {
  e.preventDefault();
  e.stopPropagation();
  if (document.activeElement && document.activeElement.isContentEditable){
    document.activeElement.blur();
  }
  doneBtn.classList.remove('show');
});

document.addEventListener('pointerdown', (e) => {
  const active = document.activeElement;
  if (!active || !active.isContentEditable) return;
  if (active === e.target) return;
  if (active.contains(e.target)) return;
  if (e.target.isContentEditable) return;
  if (e.target === doneBtn || doneBtn.contains(e.target)) return;
  active.blur();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape'){
    if (document.activeElement && document.activeElement.isContentEditable){
      document.activeElement.blur();
    }
  }
});

/* ==================== বিষয় ইনপুট ==================== */
function loadSubjects(){
  const cls = document.getElementById('cls').value;
  const box = document.getElementById('subjectsBox');
  const field = document.getElementById('subjectsField');
  box.innerHTML = '';
  if (!cls || !classSubjects[cls]) { field.style.display = 'none'; return; }
  field.style.display = 'block';

  const subjects = classSubjects[cls];
  subjects.forEach((sub, index) => {
    const row = document.createElement('div');
    row.className = 'subject-row';

    const lbl = document.createElement('label');
    lbl.innerText = sub;

    const inp = document.createElement('input');
    inp.type = 'text';
    inp.className = 'subject-input';
    inp.placeholder = 'যেমন: ১-৫ পৃষ্ঠা';
    inp.dataset.subject = sub;
    inp.autocomplete = 'off';

    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Enter'){
        e.preventDefault();
        const next = document.querySelectorAll('.subject-input')[index + 1];
        if (next) next.focus();
        else showPreview();
      }
    });

    row.appendChild(lbl);
    row.appendChild(inp);
    box.appendChild(row);
  });

  setTimeout(() => {
    const first = document.querySelector('.subject-input');
    if (first) first.focus();
  }, 80);
}

/* =========================================================
   প্রিভিউ
   ========================================================= */
function showPreview(){
  const cls = document.getElementById('cls').value;
  if (!cls) { alert("শ্রেণি নির্বাচন করুন"); return; }

  const dateVal = document.getElementById('date').value;
  document.getElementById('editClass').innerText = "শ্রেণি: " + cls;
  const parts = dateVal.split("-");
  document.getElementById('editDate').innerText = bn(parts[2]) + "-" + bn(parts[1]) + "-" + bn(parts[0]);

  const table = document.getElementById('previewTable');
  table.innerHTML = '';
  document.querySelectorAll('.subject-input').forEach(inp => {
    const sub = inp.dataset.subject;
    const val = inp.value || '—';
    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="subject-cell">${sub}:</td><td class="lesson-cell" contenteditable="true">${val}</td>`;
    table.appendChild(tr);
  });

  invalidateCanvasCache();

  document.getElementById('formPage').style.display = 'none';
  document.getElementById('previewPage').style.display = 'block';
  window.scrollTo(0, 0);

  requestAnimationFrame(() => {
    sizeCardSquare();
    requestAnimationFrame(() => {
      sizeCardSquare();
      fitToSquare();
    });
  });
}

/* =========================================================
   ১:১ কার্ডে অটো-ফিট + ভার্টিক্যাল সেন্টার
   বাইনারি সার্চ — ~৫ reflow (আগে ~৩০)
   ========================================================= */
function fitToSquare(){
  const card  = document.getElementById('card');
  const wrap  = document.getElementById('tableWrap');
  const table = document.getElementById('previewTable');
  const rows  = table.querySelectorAll('tr');
  if (!rows.length) return;

  // সব সেল একবারে collect
  const cells = [];
  rows.forEach(tr => tr.querySelectorAll('td').forEach(td => cells.push(td)));

  table.style.transform = '';
  table.style.transformOrigin = '';
  table.style.width = '100%';
  table.style.marginTop = '0px';
  cells.forEach(td => {
    td.style.fontSize = '';
    td.style.paddingTop = '';
    td.style.paddingBottom = '';
    td.style.lineHeight = '1.25';
  });

  const cardPx = card.clientWidth;
  const wrapH  = wrap.clientHeight;

  const minFont = Math.max(6, Math.round(cardPx * 0.014));
  const maxFont = Math.round(cardPx * 0.05);

  function apply(fs){
    const pad = fs * 0.08;
    for (let i = 0; i < cells.length; i++){
      cells[i].style.fontSize = fs + 'px';
      cells[i].style.paddingTop = pad + 'px';
      cells[i].style.paddingBottom = pad + 'px';
    }
  }

  // বাইনারি সার্চ — সবচেয়ে বড় font যেটা wrapH-এ আঁটে
  let lo = minFont, hi = maxFont, best = minFont;
  while (lo <= hi){
    const mid = (lo + hi) >> 1;
    apply(mid);
    if (table.scrollHeight <= wrapH){ best = mid; lo = mid + 1; }
    else { hi = mid - 1; }
  }
  apply(best);

  let currentScale = 1;

  if (table.scrollHeight > wrapH){
    let scale = wrapH / table.scrollHeight;
    for (let i = 0; i < 6; i++){
      table.style.transformOrigin = 'top left';
      table.style.transform = 'scale(' + scale + ')';
      table.style.width = (100 / scale) + '%';
      const visualH = table.scrollHeight * scale;
      if (visualH <= wrapH) break;
      scale = scale * (wrapH / visualH);
    }
    table.style.transformOrigin = 'top left';
    table.style.transform = 'scale(' + scale + ')';
    table.style.width = (100 / scale) + '%';
    currentScale = scale;
  }

  const visualH = table.scrollHeight * currentScale;
  const leftover = wrapH - visualH;
  if (leftover > 2){
    table.style.marginTop = Math.round(leftover / 2) + 'px';
  } else {
    table.style.marginTop = '0px';
  }
}

window.addEventListener('resize', () => {
  if (document.getElementById('previewPage').style.display === 'block'){
    sizeCardSquare();
    fitToSquare();
  }
});

function backToForm(){
  document.getElementById('previewPage').style.display = 'none';
  document.getElementById('formPage').style.display = 'block';
  window.scrollTo(0, 0);

/* =========================================================
   scale "বেক"
   ========================================================= */
function bakeScaleForCapture(){
  const table = document.getElementById('previewTable');
  const rows = table.querySelectorAll('tr');
  const m = (table.style.transform || '').match(/scale\(([\d.]+)\)/);
  if (!m) return null;

  const scale = parseFloat(m[1]);
  if (scale >= 1) return null;

  const orig = {
    transform: table.style.transform,
    transformOrigin: table.style.transformOrigin,
    width: table.style.width,
    marginTop: table.style.marginTop,
    cells: []
  };

  table.style.transform = '';
  table.style.transformOrigin = '';
  table.style.width = '100%';
  table.style.marginTop = '0px';

  rows.forEach(tr => {
    tr.querySelectorAll('td').forEach(td => {
      const cs = getComputedStyle(td);
      const fs = parseFloat(cs.fontSize);
      const pt = parseFloat(cs.paddingTop);
      const pb = parseFloat(cs.paddingBottom);
      orig.cells.push({
        td,
        fontSize: td.style.fontSize,
        paddingTop: td.style.paddingTop,
        paddingBottom: td.style.paddingBottom
      });
      td.style.fontSize = (fs * scale) + 'px';
      td.style.paddingTop = (pt * scale) + 'px';
      td.style.paddingBottom = (pb * scale) + 'px';
    });
  });

  return orig;
}

function restoreAfterCapture(orig){
  if (!orig) return;
  const table = document.getElementById('previewTable');
  table.style.transform = orig.transform;
  table.style.transformOrigin = orig.transformOrigin;
  table.style.width = orig.width;
  table.style.marginTop = orig.marginTop;
  orig.cells.forEach(c => {
    c.td.style.fontSize = c.fontSize;
    c.td.style.paddingTop = c.paddingTop;
    c.td.style.paddingBottom = c.paddingBottom;
  });
}

/* =========================================================
   ছবি তৈরি
   ========================================================= */
async function generateCanvas(){
  // ক্যাশ হিট
  if (_cachedCanvas) return _cachedCanvas;

  const card = document.getElementById('card');
  const bar = document.querySelector('.action-bar');
  const backBtn = document.getElementById('backBtn');
  const hint = document.querySelector('.hint');
  const editables = document.querySelectorAll('[contenteditable]');

  if (document.activeElement && document.activeElement.isContentEditable){
    document.activeElement.blur();
  }
  doneBtn.classList.remove('show');

  bar.style.display = 'none';
  backBtn.style.display = 'none';
  hint.style.display = 'none';
  editables.forEach(el => el.style.background = 'transparent');

  sizeCardSquare();
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  fitToSquare();

  const baked = bakeScaleForCapture();
  await new Promise(r => requestAnimationFrame(r));

  try {
    await ensureHtml2Canvas();

    // ফন্ট আগেই লোড করা থাকলে এটা তৎক্ষণাৎ resolve হবে
    if (document.fonts && document.fonts.status !== 'loaded'){
      try { await document.fonts.ready; } catch(e){}
    }

    const w = card.offsetWidth;
    const h = card.offsetHeight;
    // পুরনো: Math.max(4, 1440/w) → ৫ মেগাপিক্সেল
    // নতুন: সর্বোচ্চ ৩x, যা দরকার ততটুকুই
    const scale = Math.min(3, 1440 / w);

    const canvas = await html2canvas(card, {
      scale: scale,
      backgroundColor: '#ffffff',
      useCORS: true,
      logging: false,
      width: w,
      height: h,
      windowWidth: w,
      windowHeight: h,
      scrollX: 0,
      scrollY: 0,
      onclone: (clonedDoc) => {
        const clonedCard = clonedDoc.getElementById('card');
        if (clonedCard){
          clonedCard.style.width = w + 'px';
          clonedCard.style.height = h + 'px';
          clonedCard.style.aspectRatio = 'auto';
          clonedCard.style.minHeight = h + 'px';
          clonedCard.style.maxHeight = h + 'px';
        }
      }
    });

    restoreAfterCapture(baked);

    bar.style.display = 'flex';
    backBtn.style.display = 'flex';
    hint.style.display = 'flex';

    _cachedCanvas = canvas;
    return canvas;
  } catch (err){
    restoreAfterCapture(baked);
    bar.style.display = 'flex';
    backBtn.style.display = 'flex';
    hint.style.display = 'flex';
    alert("ছবি তৈরি করতে সমস্যা হয়েছে: " + err.message);
    return null;
  }
}

async function downloadImage(){
  const canvas = await generateCanvas();
  if (!canvas) return;
  // toBlob — মেইন থ্রেড ব্লক করে না (আগে toDataURL ছিল)
  canvas.toBlob((blob) => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.download = 'syllabus.png';
    a.href = url;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }, 'image/png');
}

async function shareImage(){
  const canvas = await generateCanvas();
  if (!canvas) return;
  canvas.toBlob(async (blob) => {
    const file = new File([blob], "syllabus.png", { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [file] })){
      try { await navigator.share({ files: [file], title: 'দৈনিক পাঠ্যসূচি', text: ' ' }); } catch(e){}
    } else {
      const link = document.createElement('a');
      link.download = 'syllabus.png';
      link.href = URL.createObjectURL(file);
      link.click();
      alert("আপনার ব্রাউজার সরাসরি শেয়ার সাপোর্ট করে না। ছবি ডাউনলোড হয়ে গেছে।");
    }
  }, "image/png", 1.0);
}

}
